<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>AI Study Companion</title></head>
<body style="font-family:sans-serif;max-width:700px;margin:40px auto">
  <h2>AI Study Companion</h2>
  <input id="q" style="width:75%" placeholder="Ask about your notes">
  <button onclick="ask()">Ask</button>
  <pre id="out" style="white-space:pre-wrap"></pre>
  <script>
    async function ask() {
      const r = await fetch("/ask", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({question: document.getElementById("q").value})
      });
      document.getElementById("out").textContent = JSON.stringify(await r.json(), null, 2);
    }
  </script>
</body>
</html>
